<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password 💌 | Our Little Universe</title>
  <meta name="description" content="Reset your password for Our Little Universe. Quick and secure password recovery.">
  <meta name="theme-color" content="#FFD6E7">

  <!-- Favicon Heart SVG -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💗</text></svg>">

  <!-- Google Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700;800&family=Sacramento&display=swap" rel="stylesheet">

  <!-- Three.js 3D WebGL Library -->
  <script src="js/three.min.js"></script>
  <script>
    if (typeof THREE === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
    }
  </script>
  <!-- 3D Romantic Universe Engine -->
  <script src="js/universe-3d.js"></script>

  <!-- Supabase Official JS SDK via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <!-- Interactive 3D WebGL Scene Canvas -->
  <canvas id="universe-3d-login-canvas" class="universe-3d-bg-canvas" aria-hidden="true"></canvas>

  <!-- Floating 2D Particle Canvas Background -->
  <canvas id="universe-bg-canvas" aria-hidden="true"></canvas>

  <!-- Header -->
  <header class="site-header" id="site-header">
    <nav class="nav-container" aria-label="Main Navigation">
      <a href="login.html" class="nav-logo" aria-label="Our Little Universe Home">
        <span class="logo-heart">💗</span>
        <span class="logo-text">Our Universe</span>
      </a>

      <!-- Hamburger Toggle for Mobile -->
      <button class="nav-toggle-btn" id="nav-toggle-btn" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="nav-links-menu">
        <div class="hamburger-icon" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </button>

      <ul class="nav-links" id="nav-links-menu">
        <li><a href="login.html" class="nav-link"><span>🔐</span> Login</a></li>
        <li><a href="signup.html" class="nav-link"><span>✨</span> Sign Up</a></li>
        <li><a href="privacy.html" class="nav-link"><span>🛡️</span> Privacy</a></li>
        <li><a href="terms.html" class="nav-link"><span>📜</span> Terms</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Container -->
  <main class="auth-main">
    <div class="auth-container">

      <!-- Reset Glass Card -->
      <div class="auth-card glass-card">
        
        <div class="auth-heart-badge" aria-hidden="true">
          <div class="auth-heart-glow"></div>
          <span class="auth-heart-emoji">💌</span>
        </div>

        <h1 class="auth-title cursive-title" id="reset-card-title">Reset Your Password 💌</h1>
        <p class="auth-subtitle" id="reset-card-subtitle">Enter your email and we'll help you get back to your universe.</p>

        <!-- Alert Banner -->
        <div id="auth-alert" class="alert-banner" role="alert" style="display: none;"></div>

        <!-- 1. Request Reset Link Form (Default View) -->
        <form id="reset-request-form" class="auth-form" novalidate>
          <div class="form-group">
            <label for="reset-email" class="form-label">
              <span>💌</span> Account Email Address
            </label>
            <div class="input-wrapper">
              <input
                type="email"
                id="reset-email"
                name="email"
                class="form-input"
                placeholder="you@ouruniverse.love"
                required
                autocomplete="email"
              >
            </div>
          </div>

          <button type="submit" id="btn-request-submit" class="btn btn-primary auth-btn-submit">
            <span class="btn-text">Send Reset Instructions 💌</span>
            <span class="btn-spinner" style="display: none;">⏳ Sending...</span>
          </button>
        </form>

        <!-- 2. Set New Password Form (When Token is Present) -->
        <form id="reset-confirm-form" class="auth-form" style="display: none;" novalidate>
          <div class="form-group">
            <label for="new-password" class="form-label">
              <span>🔑</span> New Password
            </label>
            <div class="input-wrapper">
              <input
                type="password"
                id="new-password"
                name="newPassword"
                class="form-input"
                placeholder="At least 8 characters"
                required
              >
            </div>
          </div>

          <div class="form-group">
            <label for="new-password-confirm" class="form-label">
              <span>🔒</span> Confirm New Password
            </label>
            <div class="input-wrapper">
              <input
                type="password"
                id="new-password-confirm"
                name="confirmPassword"
                class="form-input"
                placeholder="Repeat your new password"
                required
              >
            </div>
          </div>

          <button type="submit" id="btn-confirm-submit" class="btn btn-primary auth-btn-submit">
            <span class="btn-text">Save New Password 💗</span>
            <span class="btn-spinner" style="display: none;">⏳ Updating...</span>
          </button>
        </form>

        <!-- Divider -->
        <div class="auth-divider" aria-hidden="true">
          <span>🌸</span>
        </div>

        <!-- Back to Login -->
        <div class="auth-footer-prompt">
          <p>Remember your password?</p>
          <a href="login.html" class="auth-link-bold">Return to Login 💕</a>
        </div>

      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-container">
      <div class="footer-bottom-bar" style="justify-content: center; gap: 1.5rem;">
        <p class="footer-copy">
          &copy; <span id="footer-year"></span> Our Little Universe. Created with infinite love.
        </p>
        <div class="footer-auth-links">
          <a href="privacy.html" class="footer-link"><span>🛡️</span> Privacy Policy</a>
          <span style="opacity: 0.5;">•</span>
          <a href="terms.html" class="footer-link"><span>📜</span> Terms of Use</a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
  <script src="js/script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const y = document.getElementById('footer-year');
      if (y) y.textContent = new Date().getFullYear();

      // Initialize 3D Romantic Universe Scene
      try {
        if (window.Universe3D && window.Universe3D.initLoginScene) {
          window.Universe3D.initLoginScene('universe-3d-login-canvas');
        }
      } catch (err3d) {
        console.warn('3D reset scene note:', err3d);
      }

      await window.UniverseAuth.init();

      const alertBox = document.getElementById('auth-alert');
      const reqForm = document.getElementById('reset-request-form');
      const confForm = document.getElementById('reset-confirm-form');
      const cardTitle = document.getElementById('reset-card-title');
      const cardSub = document.getElementById('reset-card-subtitle');

      // Check if arriving with token or hash recovery
      const urlParams = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      const resetToken = urlParams.get('token');
      const isRecovery = hashParams.get('type') === 'recovery' || Boolean(resetToken);

      if (isRecovery) {
        reqForm.style.display = 'none';
        confForm.style.display = 'block';
        cardTitle.textContent = 'Set Your New Password 🔑';
        cardSub.textContent = 'Choose a strong, sweet password of at least 8 characters.';
      }

      function showAlert(msg, type = 'error') {
        if (!alertBox) return;
        alertBox.textContent = msg;
        alertBox.className = `alert-banner alert-${type}`;
        alertBox.style.display = 'block';
      }

      function hideAlert() {
        if (alertBox) alertBox.style.display = 'none';
      }

      // Request link submit
      if (reqForm) {
        reqForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          hideAlert();
          const email = document.getElementById('reset-email').value.trim();
          if (!email) {
            showAlert('Please enter your email address! 💌', 'error');
            return;
          }

          const btn = document.getElementById('btn-request-submit');
          const btnText = btn.querySelector('.btn-text');
          const btnSpinner = btn.querySelector('.btn-spinner');
          btn.disabled = true;
          btnText.style.display = 'none';
          btnSpinner.style.display = 'inline';

          try {
            const res = await window.UniverseAuth.requestPasswordReset(email);
            if (res.success) {
              showAlert(res.message || 'Password reset instructions have been prepared! 💌', 'success');
              if (res.resetToken) {
                // In local dev mode, offer instant 1-click continuation
                setTimeout(() => {
                  showAlert(`✨ Local Dev Hint: Reset token generated! Redirecting to password update form...`, 'info');
                  setTimeout(() => {
                    window.location.replace(`reset-password.html?token=${res.resetToken}`);
                  }, 1500);
                }, 1000);
              }
            } else {
              showAlert(res.error || 'Could not process reset request.', 'error');
              btn.disabled = false;
              btnText.style.display = 'inline';
              btnSpinner.style.display = 'none';
            }
          } catch (err) {
            showAlert('Network error. Please try again.', 'error');
            btn.disabled = false;
            btnText.style.display = 'inline';
            btnSpinner.style.display = 'none';
          }
        });
      }

      // Confirm new password submit
      if (confForm) {
        confForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          hideAlert();
          const p1 = document.getElementById('new-password').value;
          const p2 = document.getElementById('new-password-confirm').value;

          if (p1.length < 8) {
            showAlert('Password must be at least 8 characters long! 🔑', 'error');
            return;
          }
          if (p1 !== p2) {
            showAlert('Passwords do not match! 💕', 'error');
            return;
          }

          const btn = document.getElementById('btn-confirm-submit');
          const btnText = btn.querySelector('.btn-text');
          const btnSpinner = btn.querySelector('.btn-spinner');
          btn.disabled = true;
          btnText.style.display = 'none';
          btnSpinner.style.display = 'inline';

          try {
            const res = await window.UniverseAuth.confirmPasswordReset({
              token: resetToken,
              newPassword: p1
            });

            if (res.success) {
              showAlert('✨ Password updated successfully! Redirecting to login...', 'success');
              setTimeout(() => {
                window.location.replace('login.html');
              }, 1200);
            } else {
              showAlert(res.error || 'Failed to update password.', 'error');
              btn.disabled = false;
              btnText.style.display = 'inline';
              btnSpinner.style.display = 'none';
            }
          } catch (err) {
            showAlert('Network error. Please try again.', 'error');
            btn.disabled = false;
            btnText.style.display = 'inline';
            btnSpinner.style.display = 'none';
          }
        });
      }
    });
  </script>
</body>
</html>
