<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="roomGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFEED6" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#6F456B" />
      <stop offset="100%" stop-color="#341A33" />
    </radialGradient>
    <filter id="softGlow6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Room Interior Background with warm fort glow -->
  <rect width="800" height="600" fill="url(#roomGlow)" />

  <!-- Blanket Tent / Fort Canopy Drape -->
  <path d="M 400 60 L 60 520 L 740 520 Z" fill="#FFD6E7" opacity="0.45" />
  <!-- Left Curtain Drape Fold -->
  <path d="M 400 60 Q 200 240 100 520 Q 260 480 340 520 Z" fill="#FFB6D5" opacity="0.75" />
  <!-- Right Curtain Drape Fold -->
  <path d="M 400 60 Q 600 240 700 520 Q 540 480 460 520 Z" fill="#DCD6FF" opacity="0.75" />
  <!-- Center Peek into Fort -->
  <path d="M 400 130 Q 340 320 250 520 L 550 520 Q 460 320 400 130 Z" fill="#FFF4EA" />

  <!-- Fairy Lights Draped along Canopy Edge -->
  <path d="M 120 490 Q 240 280 395 100 Q 560 280 680 490" fill="none" stroke="#FFF8F2" stroke-width="2.5" opacity="0.8" />
  <circle cx="160" cy="420" r="7" fill="#FFE29A" filter="url(#softGlow6)" />
  <circle cx="215" cy="335" r="7" fill="#FFB6D5" filter="url(#softGlow6)" />
  <circle cx="280" cy="245" r="7.5" fill="#FFE29A" filter="url(#softGlow6)" />
  <circle cx="345" cy="165" r="7" fill="#DCD6FF" filter="url(#softGlow6)" />
  <circle cx="400" cy="115" r="9" fill="#FFE29A" filter="url(#softGlow6)" />
  <circle cx="455" cy="165" r="7" fill="#FFB6D5" filter="url(#softGlow6)" />
  <circle cx="520" cy="245" r="7.5" fill="#FFE29A" filter="url(#softGlow6)" />
  <circle cx="585" cy="335" r="7" fill="#DCD6FF" filter="url(#softGlow6)" />
  <circle cx="640" cy="420" r="7" fill="#FFE29A" filter="url(#softGlow6)" />

  <!-- Fluffy Pillows Inside Fort -->
  <!-- Back Left Pillow (Lavender) -->
  <rect x="250" y="380" width="100" height="75" rx="20" fill="#DCD6FF" transform="rotate(-15 250 380)" stroke="#B7AADB" stroke-width="2" />
  <!-- Back Right Pillow (Blush) -->
  <rect x="440" y="360" width="105" height="75" rx="20" fill="#FFB6D5" transform="rotate(18 440 360)" stroke="#E59BBF" stroke-width="2" />
  <!-- Fluffy Cloud Pillow Bottom -->
  <ellipse cx="400" cy="490" rx="140" ry="40" fill="#FFF8F2" />

  <!-- Cute Plush Teddy Bear in Center -->
  <g transform="translate(350, 360)">
    <!-- Ears -->
    <circle cx="22" cy="20" r="16" fill="#C89D78" />
    <circle cx="22" cy="20" r="9" fill="#FFB6D5" />
    <circle cx="78" cy="20" r="16" fill="#C89D78" />
    <circle cx="78" cy="20" r="9" fill="#FFB6D5" />
    <!-- Head -->
    <ellipse cx="50" cy="45" rx="36" ry="32" fill="#D9B28D" />
    <!-- Muzzle -->
    <ellipse cx="50" cy="54" rx="17" ry="13" fill="#FFF8F2" />
    <!-- Cute Nose & Mouth -->
    <polygon points="50,47 45,43 55,43" fill="#51364F" />
    <path d="M 50 48 L 50 54 Q 45 60 40 56 M 50 54 Q 55 60 60 56" fill="none" stroke="#51364F" stroke-width="2" stroke-linecap="round" />
    <!-- Eyes -->
    <circle cx="37" cy="40" r="4.5" fill="#361D32" />
    <circle cx="36" cy="38" r="1.5" fill="#FFF8F2" />
    <circle cx="63" cy="40" r="4.5" fill="#361D32" />
    <circle cx="62" cy="38" r="1.5" fill="#FFF8F2" />
    <!-- Blush Cheeks -->
    <circle cx="27" cy="50" r="6" fill="#FF8BA7" opacity="0.6" />
    <circle cx="73" cy="50" r="6" fill="#FF8BA7" opacity="0.6" />
    <!-- Body -->
    <ellipse cx="50" cy="100" rx="38" ry="36" fill="#D9B28D" />
    <!-- Bear Arms Hugging Heart -->
    <path d="M 18 85 Q 35 105 45 100" stroke="#C89D78" stroke-width="14" stroke-linecap="round" fill="none" />
    <path d="M 82 85 Q 65 105 55 100" stroke="#C89D78" stroke-width="14" stroke-linecap="round" fill="none" />
    <!-- Big Heart Bear is holding -->
    <path d="M 50 90 C 50 80, 36 74, 28 85 C 18 100, 50 120, 50 120 C 50 120, 82 100, 72 85 C 64 74, 50 80, 50 90 Z" fill="#FF5C8A" />
    <!-- Bear Feet -->
    <ellipse cx="25" cy="130" rx="16" ry="12" fill="#C89D78" />
    <circle cx="25" cy="130" r="6" fill="#FFB6D5" />
    <ellipse cx="75" cy="130" rx="16" ry="12" fill="#C89D78" />
    <circle cx="75" cy="130" r="6" fill="#FFB6D5" />
  </g>

  <!-- Twinkling floating hearts inside fort -->
  <g fill="#FF5C8A" opacity="0.8">
    <path d="M 280 280 C 280 274, 270 270, 264 278 C 256 288, 280 302, 280 302 C 280 302, 304 288, 296 278 C 290 270, 280 274, 280 280 Z" />
    <path d="M 510 270 C 510 265, 502 261, 497 267 C 491 275, 510 287, 510 287 C 510 287, 529 275, 523 267 C 518 261, 510 265, 510 270 Z" />
  </g>

  <!-- Caption text -->
  <text x="400" y="570" font-family="'Caveat', cursive, sans-serif" font-size="28" fill="#FFD6E7" text-anchor="middle" letter-spacing="1.5">A blanket fort, warm hugs &amp; endless dreaming 🧸</text>
</svg>
