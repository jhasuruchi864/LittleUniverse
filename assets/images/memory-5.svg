<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceNebula" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FF5C8A" stop-opacity="0.35" />
      <stop offset="35%" stop-color="#764573" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#3A1C3C" />
      <stop offset="100%" stop-color="#190B1E" />
    </radialGradient>
    <linearGradient id="shootingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F2" />
      <stop offset="40%" stop-color="#FFB6D5" />
      <stop offset="100%" stop-color="#51364F" stop-opacity="0" />
    </linearGradient>
    <filter id="starGlow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Cosmos Background -->
  <rect width="800" height="600" fill="url(#spaceNebula)" />

  <!-- Soft Nebula Clouds -->
  <ellipse cx="320" cy="200" rx="220" ry="120" fill="#DCD6FF" opacity="0.15" filter="url(#starGlow5)" />
  <ellipse cx="500" cy="280" rx="200" ry="100" fill="#FFB6D5" opacity="0.18" filter="url(#starGlow5)" />

  <!-- Stars Field -->
  <g fill="#FFF8F2">
    <circle cx="80" cy="90" r="1.5" opacity="0.8" />
    <circle cx="150" cy="60" r="2" opacity="0.9" />
    <circle cx="240" cy="110" r="1" opacity="0.7" />
    <circle cx="360" cy="70" r="2.5" opacity="0.95" />
    <circle cx="580" cy="80" r="1.5" opacity="0.8" />
    <circle cx="680" cy="140" r="2.2" opacity="0.9" />
    <circle cx="720" cy="60" r="1" opacity="0.6" />
    <circle cx="110" cy="260" r="1.8" opacity="0.8" />
    <circle cx="690" cy="310" r="1.5" opacity="0.75" />
    <circle cx="480" cy="180" r="1.2" opacity="0.7" />
    <circle cx="280" cy="240" r="2" opacity="0.85" />
    <circle cx="620" cy="210" r="1.5" opacity="0.7" />
  </g>

  <!-- Glowing Heart Constellation -->
  <g filter="url(#starGlow5)">
    <!-- Constellation Lines -->
    <path d="M 400 130 L 440 90 L 480 110 L 460 170 L 400 230 L 340 170 L 320 110 L 360 90 Z" fill="none" stroke="#FFD6E7" stroke-width="2" stroke-dasharray="4,6" opacity="0.85" />
    <!-- Constellation Stars -->
    <circle cx="400" cy="130" r="4.5" fill="#FFF8F2" />
    <circle cx="440" cy="90" r="5" fill="#FFE29A" />
    <circle cx="480" cy="110" r="4.5" fill="#FFF8F2" />
    <circle cx="460" cy="170" r="4.5" fill="#FFB6D5" />
    <circle cx="400" cy="230" r="6" fill="#FFF8F2" />
    <circle cx="340" cy="170" r="4.5" fill="#FFB6D5" />
    <circle cx="320" cy="110" r="4.5" fill="#FFF8F2" />
    <circle cx="360" cy="90" r="5" fill="#FFE29A" />
    <!-- Sparkle Cross on main star -->
    <polygon points="400,218 402,228 412,230 402,232 400,242 398,232 388,230 398,228" fill="#FFF8F2" />
  </g>

  <!-- Shooting Star Streaking Across -->
  <g>
    <line x1="620" y1="50" x2="480" y2="130" stroke="url(#shootingGrad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="480" cy="130" r="4" fill="#FFF8F2" filter="url(#starGlow5)" />
    <!-- Tiny sparkle head -->
    <polygon points="480,123 482,128 487,130 482,132 480,137 478,132 473,130 478,128" fill="#FFF8F2" />
  </g>

  <!-- Starry Hill Horizon -->
  <path d="M 0 490 Q 250 420 500 460 T 800 450 L 800 600 L 0 600 Z" fill="#200E24" />
  <path d="M 200 600 Q 450 440 800 480 L 800 600 Z" fill="#130816" opacity="0.7" />

  <!-- Cute Brass/Pastel Telescope on Tripod -->
  <g transform="translate(260, 360)">
    <!-- Tripod Legs -->
    <line x1="80" y1="80" x2="30" y2="180" stroke="#FFB6D5" stroke-width="4.5" stroke-linecap="round" />
    <line x1="80" y1="80" x2="80" y2="180" stroke="#9C6B8E" stroke-width="4.5" stroke-linecap="round" />
    <line x1="80" y1="80" x2="130" y2="180" stroke="#FFB6D5" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="80" cy="80" r="7" fill="#FFE29A" />

    <!-- Telescope Tube (pointing upward to constellation) -->
    <g transform="rotate(-36 80 80)">
      <!-- Main Barrel -->
      <rect x="20" y="70" width="120" height="20" rx="5" fill="#FFE29A" />
      <rect x="130" y="67" width="20" height="26" rx="4" fill="#FFB6D5" />
      <rect x="0" y="74" width="25" height="12" rx="2" fill="#51364F" />
      <!-- Eyepiece -->
      <rect x="-10" y="76" width="12" height="8" rx="2" fill="#FFE29A" />
      <!-- Star Finder Mini Scope -->
      <rect x="60" y="58" width="40" height="8" rx="2" fill="#DCD6FF" />
      <line x1="70" y1="66" x2="70" y2="70" stroke="#FFE29A" stroke-width="2" />
      <line x1="90" y1="66" x2="90" y2="70" stroke="#FFE29A" stroke-width="2" />
    </g>
  </g>

  <!-- Glowing Mason Jar with Fairy Lights on grass -->
  <g transform="translate(420, 480)">
    <!-- Jar glass -->
    <rect x="0" y="10" width="45" height="60" rx="8" fill="#FFF8F2" opacity="0.25" stroke="#FFF8F2" stroke-width="2" />
    <!-- Lid with twine bow -->
    <rect x="-3" y="6" width="51" height="8" rx="3" fill="#D79E66" />
    <!-- Glowing fairy fireflies inside -->
    <circle cx="15" cy="30" r="4" fill="#FFE29A" filter="url(#starGlow5)" />
    <circle cx="32" cy="40" r="3.5" fill="#FFB6D5" filter="url(#starGlow5)" />
    <circle cx="22" cy="54" r="4" fill="#FFE29A" filter="url(#starGlow5)" />
  </g>

  <!-- Caption text -->
  <text x="400" y="570" font-family="'Caveat', cursive, sans-serif" font-size="28" fill="#FFD6E7" text-anchor="middle" letter-spacing="1.5">You are my favorite constellation in the galaxy ✨</text>
</svg>
